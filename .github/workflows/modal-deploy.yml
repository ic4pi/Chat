# Deploys the Modal apps from GitHub, so no local Python or Modal CLI is needed.
#
# One-time setup — repo Settings → Secrets and variables → Actions:
#   MODAL_TOKEN_ID       from modal.com → Settings → API Tokens
#   MODAL_TOKEN_SECRET   same screen
#
# Run it from the Actions tab → "Deploy Modal apps" → Run workflow.
#
# Deliberately manual: these apps hold GPU workloads, and deploying them on
# every push to main would redeploy weights-loading containers for changes
# that never touch them.
name: Deploy Modal apps

on:
  workflow_dispatch:
    inputs:
      suffix:
        description: 'App name suffix. "-v2" deploys beside the live apps; empty replaces them.'
        required: false
        default: '-v2'
      apps:
        description: 'Which apps to deploy'
        required: true
        default: 'all'
        type: choice
        options: [all, sdxl, ltx, wan]
      mode:
        description: 'deploy, or probe to only report which model repos are reachable'
        required: true
        default: 'deploy'
        type: choice
        options: [deploy, probe]
      search:
        description: 'probe mode only - comma-separated Hub search terms'
        required: false
        default: 'lustify sdxl,wai nsfw illustrious'
      profile:
        description: 'smoke size. quick = 512px/8 steps. batch = 1024px/30 steps/4 images (real cost)'
        required: false
        default: 'quick'
        type: choice
        options: [quick, batch]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Modal
        run: pip install modal

      # A model repo that has been deleted, renamed or gated fails the image
      # build ~10 minutes in, as a RepositoryNotFoundError buried in build
      # output - which is how a dead SDXL checkpoint read as a caching bug for
      # days. Ask the Hub first; it takes seconds. The repo ids come from the
      # app files themselves, so this cannot drift from what they load.
      - name: Preflight model repos
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -o pipefail
          if python3 modal/check_apps.py --repos | python3 .github/scripts/hf_check.py --status; then
            echo "All model repos reachable."
          elif [ "${{ inputs.mode }}" = "deploy" ]; then
            echo "::error::A model repo above is unreachable, so the image build would fail. Fix the repo id in modal/ (or add an HF_TOKEN secret if it is gated) and re-run."
            exit 1
          fi

      - name: Search the Hub for replacements
        if: ${{ inputs.mode == 'probe' }}
        run: |
          IFS=',' read -ra TERMS <<< "${{ inputs.search }}"
          python3 .github/scripts/hf_check.py --search "${TERMS[@]}"

      # Which weight file inside a LoRA repo to load is not guessable: the
      # Lightning repo carries one set per Wan variant and the wrong one fails
      # with hundreds of shape mismatches, not a name error.
      - name: List LoRA repo contents
        if: ${{ inputs.mode == 'probe' }}
        run: |
          python3 .github/scripts/hf_check.py --files \
            lightx2v/Wan2.2-Lightning ByteDance/SDXL-Lightning

      # "Token validation failed" says nothing about which half is wrong. The
      # prefixes (ak- / as-) are structural, not secret, so checking them and
      # the lengths distinguishes swapped halves and pasted whitespace — the
      # two things that produce this error with a valid token.
      - name: Check token shape
        if: ${{ inputs.mode == 'deploy' }}
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          probe() {
            local name="$1" val="$2" want="$3"
            if [ -z "$val" ]; then echo "$name: MISSING"; return 1; fi
            local trimmed; trimmed=$(printf '%s' "$val" | tr -d '[:space:]')
            local ws=""; [ "${#trimmed}" -ne "${#val}" ] && ws="  <-- HAS WHITESPACE, re-paste it"
            case "$trimmed" in
              "$want"*) echo "$name: starts '$want' ok, length ${#trimmed}$ws"; [ -z "$ws" ] || return 1 ;;
              ak-*)     echo "$name: starts 'ak-' — that is the ID, halves are SWAPPED$ws"; return 1 ;;
              as-*)     echo "$name: starts 'as-' — that is the SECRET, halves are SWAPPED$ws"; return 1 ;;
              *)        echo "$name: unexpected prefix, length ${#trimmed}$ws"; return 1 ;;
            esac
          }
          bad=0
          probe MODAL_TOKEN_ID     "$MODAL_TOKEN_ID"     "ak-" || bad=1
          probe MODAL_TOKEN_SECRET "$MODAL_TOKEN_SECRET" "as-" || bad=1
          if [ "$bad" = 1 ]; then
            echo "::error::Token secrets are the wrong shape — see the two lines above."
            exit 1
          fi
          echo "Both halves look right; handing off to modal deploy."

      - name: Deploy
        if: ${{ inputs.mode == 'deploy' }}
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          SUFFIX: ${{ inputs.suffix }}
          APPS: ${{ inputs.apps }}
        run: |
          set -euo pipefail
          if [ -z "${MODAL_TOKEN_ID:-}" ] || [ -z "${MODAL_TOKEN_SECRET:-}" ]; then
            echo "::error::Set MODAL_TOKEN_ID and MODAL_TOKEN_SECRET in repo secrets first."
            exit 1
          fi

          deploy() {  # $1 = base app name, $2 = file
            echo "::group::$1$SUFFIX"
            MODAL_APP_NAME="$1$SUFFIX" modal deploy "$2"
            echo "::endgroup::"
            echo "  https://ic4pi--$1$SUFFIX-generate.modal.run" >> "$GITHUB_STEP_SUMMARY"
          }

          echo "### Deployed endpoints" >> "$GITHUB_STEP_SUMMARY"
          case "$APPS" in
            all)  deploy sdxl-nsfw modal/sdxl_app.py
                  deploy ltx-video modal/ltx_app.py
                  deploy wan-video modal/wan_app.py ;;
            sdxl) deploy sdxl-nsfw modal/sdxl_app.py ;;
            ltx)  deploy ltx-video modal/ltx_app.py ;;
            wan)  deploy wan-video modal/wan_app.py ;;
          esac

          {
            echo ""
            echo "Point the site at these in Vercel → Settings → Environment Variables"
            echo "(Production), then redeploy. Deleting them reverts to the originals."
          } >> "$GITHUB_STEP_SUMMARY"

      # "Deployed" only means the container image built. It says nothing about
      # whether the checkpoint loads on a GPU or whether a request returns
      # pixels - the gap that let a dead checkpoint id sit here while deploys
      # went green. Generate one small image for real.
      - name: Smoke test the deployed apps
        if: ${{ inputs.mode == 'deploy' }}
        run: |
          # --suffix=-v2, not --suffix -v2: argparse reads a leading dash as
          # the start of another flag and dies with "expected one argument".
          python3 .github/scripts/modal_smoke.py \
            --workspace=ic4pi --suffix="${{ inputs.suffix }}" --apps="${{ inputs.apps }}" \
            --profile="${{ inputs.profile }}"
