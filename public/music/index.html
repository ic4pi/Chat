<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Jive — Music</title>
<meta name="theme-color" content="#0B0D12" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" href="/favicon.png" />
<link rel="stylesheet" href="/music/music.css" />
</head>
<body>
  <header class="top">
    <a class="back" href="/" title="Back to chat">← Chat</a>
    <h1>Music · MIDI Humanizer</h1>
  </header>

  <main>
    <section class="card start">
      <div id="drop" class="drop" role="button" tabindex="0">Drop a .mid file here, or tap to choose</div>
      <input id="file" type="file" accept=".mid,.midi,audio/midi" hidden />
      <button id="demo" class="btn">Load demo groove</button>
      <div id="status" aria-live="polite"></div>
    </section>

    <div class="gated">
      <section class="card">
        <div class="row"><strong id="songName">—</strong></div>
        <div id="tracks" class="tracks"></div>
      </section>

      <section class="card">
        <div class="row between">
          <label class="inline">Preset <select id="preset"></select></label>
          <label class="inline">Swing grid <select id="swingGrid"><option value="8">8th</option><option value="16">16th</option></select></label>
          <button id="reroll" class="btn">🎲 Reroll</button>
        </div>
        <div id="sliders" class="sliders"></div>
      </section>

      <section class="card">
        <div class="row between">
          <div class="row">
            <button id="playO" class="btn">▶ Original</button>
            <button id="playH" class="btn primary">▶ Humanized</button>
            <button id="stop" class="btn">■</button>
          </div>
          <div class="row">
            <label class="inline">View <select id="view"></select></label>
            <label class="inline">Zoom <input id="zoom" type="range" min="0.02" max="0.3" step="0.01" value="0.08" /></label>
            <button id="export" class="btn">⬇ Export .mid</button>
          </div>
        </div>
        <div class="legend">Outline = original position · Filled = humanized · Brightness = velocity · White = added ghost note</div>
        <div class="rollwrap"><canvas id="canvas"></canvas></div>
      </section>

      <section class="card">
        <h2>What changed</h2>
        <div id="explain"></div>
        <div class="row"><button id="coach" class="btn primary">Ask the AI coach to teach this</button></div>
        <div id="coachOut" class="coach"></div>
      </section>
    </div>
  </main>
  <script src="/music/music.js"></script>
</body>
</html>
